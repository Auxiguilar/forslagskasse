<!DOCTYPE html>
<html lang="no">
    <head>
        <title>Forslagskasse</title>
    </head>
    <body>
        <h1>Forslagskasse</h1>
        <p>Gi et forslag:</p>
        <form method="post" enctype="multipart/form-data" onsubmit="return confirm('Send inn dette forslaget?');">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Send inn</button>
        </form>
        <script>
        const input = document.getElementById("id_attachments");
        const maxFiles = 5;
        const maxFileSize = 5 * 1024 * 1024;

        input.addEventListener("change", () => {
            const files = Array.from(input.files);

            if (files.length > maxFiles) {
            alert("Du kan laste opp maksimalt 5 filer.");
            input.value = "";
            return;
            }

            const oversized = files.find(file => file.size > maxFileSize);

            if (oversized) {
            alert(`Filen "${oversized.name}" er større enn 5 MiB.`);
            input.value = "";
            }
        });
        </script>
        <h3>Admin</h3>
        <a href="{% url 'admin:index' %}"><button type="button">Logg inn</button></a>
    </body>
</html>
