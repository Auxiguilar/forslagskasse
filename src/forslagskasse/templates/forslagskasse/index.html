<!DOCTYPE html>
<html lang="no">
    <head>
        <title>Forslagskasse</title>
    </head>
    <body>
        <h1>Forslagskasse</h1>
        <p>Gi et forslag:</p>
        <form method="post" enctype="multipart/form-data" onsubmit="return confirm('Send inn dette forslaget?');">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Send inn</button>
        </form>
        <h3>Admin</h3>
        <a href="{% url 'admin:index' %}"><button type="button">Logg inn</button></a>
    </body>
</html>
